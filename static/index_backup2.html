        function checkPwdStrength(val) {
            const bars = document.querySelectorAll('.pwd-bar');
            let score = 0;
            if (val.length >= 8) score++;
            if (/[A-Z]/.test(val) && /[a-z]/.test(val)) score++;
            if (/[0-9]/.test(val) || /[^A-Za-z0-9]/.test(val)) score++;
            const cls = ['', 'weak', 'fair', 'strong'];
            bars.forEach((b, i) => { b.className = 'pwd-bar' + (i < score ? ` ${cls[score]}` : ''); });
        }

            const inp = document.getElementById(id);

        async function doRegister(e) {
            e.preventDefault();
            const name = document.getElementById('rName').value.trim();
            const email = document.getElementById('rEmail').value.trim();
            const pass = document.getElementById('rPass').value;
            const pass2 = document.getElementById('rPass2').value;
            const btn = document.getElementById('btnReg');
            const errEl = document.getElementById('regErr');
            // Validasi
            let ok = true;
            const setE = (id, msg) => { document.getElementById(id).textContent = msg; ok = ok && !msg; };
            setE('rNameErr', name ? '' : 'Nama wajib diisi');
            setE('rEmailErr', email && email.includes('@') ? '' : 'Email tidak valid');
            setE('rPassErr', pass.length >= 8 ? '' : 'Password minimal 8 karakter');
            setE('rPass2Err', pass === pass2 ? '' : 'Konfirmasi password tidak sama');
            if (!ok) return;
            btn.classList.add('btn-loading'); btn.disabled = true; errEl.textContent = '';
            try {
                const res = await api('/auth/register', { method: 'POST', body: JSON.stringify({ name, email, password: pass }) });
                setToken(res.token); _state.user = res.user; updateNavAuth();
                toast(`Selamat bergabung, ${esc(res.user.name)}! 🎉`, 'success');
                location.hash = '#/';
            } catch (ex) {
                errEl.textContent = ex.message || 'Gagal mendaftar';
                btn.classList.remove('btn-loading'); btn.disabled = false;
            }
        }

        /* ═══════════════════════════════════════════════════════════
           ADMIN VIEW
        ═══════════════════════════════════════════════════════ */
        let _adminDests = [];
        async function viewAdmin() {
            if (!isAdmin()) { toast('Akses ditolak', 'error'); location.hash = '#/'; return; }
            app.innerHTML = `<div class="page-wrapper"><div class="section" style="padding-top:calc(var(--nav-h)+2rem)">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:2rem;flex-wrap:wrap;gap:1rem">
      <h1 class="h1">Dashboard Admin</h1>
      <button class="btn btn-primary" onclick="openDestModal()">+ Tambah Wisata</button>
    </div>
    <div class="admin-table-wrap"><div id="adminTable">${skeletonCard()}</div></div>
  </div></div>`;
            try {
                _adminDests = await api('/destinations');
                renderAdminTable();
            } catch (e) { showError(); }
        }

        function renderAdminTable() {
            const el = document.getElementById('adminTable');
            if (!el) return;
            el.innerHTML = `<table role="table" aria-label="Daftar destinasi wisata">
    <thead><tr>
      <th>ID</th><th>Nama</th><th>Wilayah</th><th>Harga</th><th>Kuota/hr</th><th>Aksi</th>
    </tr></thead>
    <tbody>
      ${_adminDests.map(d => `<tr>
        <td>${d.id}</td>
        <td><strong>${esc(d.name)}</strong></td>
        <td>${esc(d.region)}</td>
        <td>${fmt(d.price)}</td>
        <td>${d.daily_quota}</td>
        <td style="display:flex;gap:0.5rem;align-items:center">
          <button class="btn btn-ghost btn-sm" onclick="openDestModal(${d.id})" aria-label="Edit ${esc(d.name)}">✏️ Edit</button>
          <button class="btn btn-danger btn-sm" onclick="deleteDest(${d.id})" aria-label="Hapus ${esc(d.name)}">🗑️</button>
        </td>
      </tr>`).join('')}
    </tbody>
  </table>`;
        }

        window.openDestModal = function (id) {
            const d = id ? _adminDests.find(x => x.id === id) : null;
            openModal(d ? 'Edit Wisata' : 'Tambah Wisata', `
    <form onsubmit="saveDestModal(event, ${id || 'null'})" novalidate>
      ${['name:Nama:text', 'region:Slug Wilayah:text', 'description:Deskripsi:text', 'price_label:Label Harga:text', 'price:Harga Dasar:number', 'price_max:Harga Plus:number', 'price_weekend:Harga Weekend:number', 'daily_quota:Kuota/Hari:number'].map(f => {
                const [key, label, type] = f.split(':');
                return `<div class="form-group"><label class="form-label" for="df_${key}">${label}</label><input class="form-input" id="df_${key}" type="${type}" value="${d ? esc(d[key] ?? '') : ''}" aria-label="${label}"></div>`;
            }).join('')}
      <button class="btn btn-primary" style="width:100%;" type="submit">${d ? 'Simpan' : 'Tambah'}</button>
    </form>
  `);
        };

        window.saveDestModal = async function (e, id) {
            e.preventDefault();
            const fields = ['name', 'region', 'description', 'price_label', 'price', 'price_max', 'price_weekend', 'daily_quota'];
            const body = {};
            fields.forEach(f => {
                const v = document.getElementById(`df_${f}`)?.value;
                body[f] = ['price', 'price_max', 'price_weekend', 'daily_quota'].includes(f) ? Number(v) : v;
            });
            if (!body.name || !body.region) { toast('Nama dan region wajib diisi', 'error'); return; }
            try {
                const headers = { 'X-Admin-Token': 'admin123' };
                if (id) await api(`/destinations/${id}`, { method: 'PUT', body: JSON.stringify(body), headers: { ...headers } });
                else await api('/destinations', { method: 'POST', body: JSON.stringify(body), headers: { ...headers } });
                closeModal(); toast('Berhasil disimpan ✓', 'success'); viewAdmin();
            } catch (ex) { toast(ex.message, 'error'); }
        };

        window.deleteDest = async function (id) {
            openModal('Hapus Wisata', `
    <p style="color:var(--text-2);margin-bottom:1.5rem">Yakin ingin menghapus wisata ini? Tindakan ini tidak bisa dibatalkan.</p>
    <div style="display:flex;gap:0.75rem">
      <button class="btn btn-ghost" style="flex:1" onclick="closeModal()">Batal</button>
      <button class="btn btn-danger" style="flex:1" onclick="confirmDelete(${id})">Ya, Hapus</button>
    </div>
  `);
        };

        window.confirmDelete = async function (id) {
            try {
                await api(`/destinations/${id}`, { method: 'DELETE', headers: { 'X-Admin-Token': 'admin123' } });
                closeModal(); toast('Wisata berhasil dihapus', 'success'); viewAdmin();
            } catch (ex) { toast(ex.message, 'error'); }
        };

        /* ═══════════════════════════════════════════════════════════
           ERROR STATE
        ═══════════════════════════════════════════════════════ */
        function showError(msg) {
            app.innerHTML = `<div class="section" style="padding-top:calc(var(--nav-h)+2rem)"><div class="empty-state"><div class="empty-state-icon">⚠️</div><h3>${msg || 'Terjadi kesalahan'}</h3><p>Coba muat ulang halaman</p><button class="btn btn-primary" style="margin-top:1rem" onclick="location.reload()">Muat Ulang</button></div></div>`;
        }

        /* ═══════════════════════════════════════════════════════════
           INIT
        ═══════════════════════════════════════════════════════ */
        tryRestoreSession().then(route);
    </script>
</body>

</html>
