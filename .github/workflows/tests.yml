name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest test_api.py test_interop.py test_interop_0_2.py test_addons.py -q
        env:
          PARTNER_KEYS: "hotel:hotel-ci-key-0123456789abcdef,transport:transport-ci-key-0123456789"
          INTEROP_OFFER_SIGNING_KEY: "ci-signing-key-for-github-actions-lokal-only"
          SECRET_KEY: "ci-secret-key"

  deep-link-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest playwright
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest test_deep_link_browser.py -q
